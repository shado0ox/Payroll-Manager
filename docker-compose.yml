version: '3.8'

services:
  # ==========================================
  # 1. PostgreSQL Database Container
  # ==========================================
  postgres-db:
    image: postgres:16-alpine
    container_name: masar_payroll_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: masar_payroll_db
      POSTGRES_USER: masar_admin
      POSTGRES_PASSWORD: MasarSecurePassword2026!
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - masar_pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masar_admin -d masar_payroll_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - masar-network

  # ==========================================
  # 2. Masar Payroll Application Container (No Nginx)
  # ==========================================
  masar-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masar_payroll_app
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://masar_admin:MasarSecurePassword2026!@postgres-db:5432/masar_payroll_db
    networks:
      - masar-network

volumes:
  masar_pg_data:
    driver: local

networks:
  masar-network:
    driver: bridge
