services:
  masar-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masar_payroll_app
    image: masar-payroll:local
    restart: unless-stopped
    init: true
    env_file: [.env]
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:size=64m,noexec,nosuid,nodev]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.00"
    networks:
      - payroll_internal
      - shared_postgres

networks:
  payroll_internal:
    internal: true
  shared_postgres:
    external: true
    name: ${POSTGRES_DOCKER_NETWORK}
